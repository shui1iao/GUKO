name: guko
services:
  guko-bot:
    image: ghcr.io/shui1iao/guko:latest
    container_name: guko-bot
    network_mode: host
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    # Reap orphaned Chromium/Crashpad children left behind by Playwright.
    init: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./servers.json:/data/servers.json
      - ./keys:/data/keys
      - ./media:/data/media
      - ./results:/data/results
      - ./history.json:/data/history.json
      - ./tmp:/data/tmp
