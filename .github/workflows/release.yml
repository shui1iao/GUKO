name: GitHub Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag, for example v0.7.0'
        required: true
        type: string
permissions:
  contents: write
  actions: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve and verify exact release identity and main CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          test "$tag" = "v$(cat version.txt)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")"
          SHA=$(git rev-parse HEAD)
          test "$SHA" = "$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push" --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")' | grep -qx true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite body/assets' >&2
            exit 1
          fi
      - name: Build exact assets and notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/build-source.py
          cp .env.example dist/default.env.example
          cp docker-compose.example.yml dist/docker-compose.example.yml
          (cd dist && sha256sum default.env.example docker-compose.example.yml "guko-${RELEASE_TAG}-source.zip" > SHA256SUMS)
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture=1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md
      - name: Publish complete new release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/default.env.example dist/docker-compose.example.yml "dist/guko-${RELEASE_TAG}-source.zip" dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md --latest
