name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n release.sh install.sh release.sh scripts/security-scan.sh
      - name: Secret scan
        run: bash scripts/security-scan.sh
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python compile
        run: python -m py_compile auth.py guko.py jiaoops.py telegram-bot/bot.py optional/update_from_nezha.py
      - name: Docker build
        run: docker build -t guko-ci -f telegram-bot/Dockerfile .
      # Openly licensed font is only for synthetic safety/geometry tests.
      # Private approved-image golden tests are run by the operator, never uploaded.
      - name: ANSI renderer tests
        run: docker run --rm --network none -e CHECKPLACE_TERMINAL_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf -v "$PWD:/src:ro" -w /src guko-ci sh -c 'node --test telegram-bot/tests/test_render_ansi*.js'
      - name: Unit tests
        run: docker run --rm --network none -v "$PWD:/src:ro" -w /src guko-ci python -m unittest discover -s tests -v
