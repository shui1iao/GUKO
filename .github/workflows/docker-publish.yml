name: Publish Docker image

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact main CI before release publication
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          MAIN=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          test "$SHA" = "$MAIN"
          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push" \
            --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")' | grep -qx true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/guko
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "$IMAGE:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi
          echo EOF >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: telegram-bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: GUKO_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
